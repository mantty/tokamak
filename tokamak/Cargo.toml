[package]
name = "tokamak"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
native = [
    "dep:base64",
    "dep:brotli",
    "dep:encoding_rs",
    "dep:fixed_decimal",
    "dep:getrandom",
    "dep:icu",
    "dep:jiff",
    "dep:lol_html",
    "dep:libc",
    "dep:openssl",
    "dep:rcgen",
    "dep:time",
    "dep:tokio",
    "dep:url",
    "dep:x509-parser",
    "dep:writeable",
    "dep:zstd",
]
test-stubs = ["native"]

[dependencies]
base64 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
flate2.workspace = true
getrandom = { workspace = true, optional = true }
fixed_decimal = { workspace = true, optional = true }
icu = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
lol_html = { workspace = true, optional = true }
jsonc-parser = { workspace = true, features = ["serde"] }
libc = { workspace = true, optional = true }
mime_guess.workspace = true
openssl = { workspace = true, optional = true }
rcgen = { workspace = true, features = ["pem", "x509-parser"], optional = true }
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
walkdir.workspace = true
writeable = { workspace = true, optional = true }
x509-parser = { workspace = true, features = ["verify"], optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
rquickjs.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
p256.workspace = true

[lints]
workspace = true
