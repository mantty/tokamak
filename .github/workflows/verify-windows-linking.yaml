name: Verify linking (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Verify Windows linking
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-x64
          cache-bin: false
          save-if: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tools/esbuild-hosts/pnpm-lock.yaml

      - name: Install platform-pack tool dependencies
        working-directory: tools/esbuild-hosts
        run: pnpm install --frozen-lockfile

      - name: Build platform pack
        run: cargo run -p xtask -- platform-pack --target windows-x64

      - name: Verify Windows storage linking
        env:
          TOKAMAK_TEST_WINDOWS_PACK: ${{ github.workspace }}/target/tokamak-platform-packs/windows-x64
        run: cargo test -p tokamak-cli --test build links_storage_from_the_windows_platform_pack_while_the_app_declares_it -- --ignored --nocapture

  android:
    name: Verify Android linking
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: android-arm64
          cache-bin: false
          save-if: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tools/esbuild-hosts/pnpm-lock.yaml

      - name: Install platform-pack tool dependencies
        working-directory: tools/esbuild-hosts
        run: pnpm install --frozen-lockfile

      - name: Build platform pack
        run: cargo run -p xtask -- platform-pack --target android-arm64

      - name: Verify Android storage linking
        env:
          TOKAMAK_TEST_ANDROID_PACK: ${{ github.workspace }}/target/tokamak-platform-packs/android-arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cargo test -p tokamak-cli --test build links_storage_from_the_android_platform_pack_while_the_app_declares_it -- --ignored --nocapture
