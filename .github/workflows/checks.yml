name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tokamak-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, test, reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip report-only pushes
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD | grep -v '^reports/' || true)"
            if [ -n "$changed" ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: clippy, rustfmt

      - name: Install jscpd
        if: steps.gate.outputs.run == 'true'
        run: npm install -g jscpd@5.4.2

      - name: Run checks and generate reports
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/collect-report.mjs all

      - name: Validate reports
        if: steps.gate.outputs.run == 'true'
        run: node scripts/validate-reports.mjs tokamak

      - name: Require all checks passed
        if: steps.gate.outputs.run == 'true'
        run: |
          failed=false
          for f in reports/tokamak-*.json; do
            if grep -q '"status": *"failed"' "$f"; then failed=true; fi
          done
          if [ "$failed" = true ]; then
            echo "One or more checks failed; see the committed reports."
            exit 1
          fi

      - name: Commit reports
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "check-reports-bot"
          git config user.email "actions@github.com"
          git fetch origin main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git add reports/ && git diff --cached --quiet || (git commit -m "Updated check reports" && git push origin main)
          else
            git add reports/ && git diff --cached --quiet || (git commit -m "Updated check reports" && git push origin HEAD)
          fi

      - name: Compare against main and update PR comment
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            execSync('node scripts/check-comment.mjs tokamak', { stdio: 'inherit' });
            const body = require('fs').readFileSync('.check-comment.md', 'utf8');
            const marker = '<!-- check-results -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
