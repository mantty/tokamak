name: Verify platform packs (temporary)

on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tokamak-pack-verify-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: "22"

jobs:
  build-platform-packs:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            app: macos
            runner: macos-15
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - target: macos-x64
            app: macos
            runner: macos-15
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - target: ios-arm64
            runner: macos-15
            rust_targets: aarch64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          - target: ios-simulator-arm64
            app: ios-simulator
            runner: macos-15
            rust_targets: aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin
          - target: ios-simulator-x64
            app: ios-simulator
            runner: macos-15
            rust_targets: x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          - target: android-arm64
            app: android
            runner: ubuntu-24.04
            rust_targets: aarch64-linux-android
          - target: windows-x64
            app: windows
            runner: windows-2025
            rust_targets: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Android SDK
        if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.rust_targets }}

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Check native build tools
        if: runner.os == 'Windows'
        run: |
          cmake --version
          nasm -v

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build platform pack
        run: cargo run -p xtask -- platform-pack --target "${{ matrix.target }}"

      - name: Verify Android storage linking
        if: matrix.target == 'android-arm64'
        env:
          TOKAMAK_TEST_ANDROID_PACK: ${{ github.workspace }}/target/tokamak-platform-packs/android-arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash platforms/android/tests/pack.sh

      - name: Verify Windows storage linking
        if: matrix.target == 'windows-x64'
        env:
          TOKAMAK_TEST_WINDOWS_PACK: ${{ github.workspace }}/target/tokamak-platform-packs/windows-x64
        run: cargo test -p tokamak-cli --test build links_storage_from_the_windows_platform_pack_while_the_app_declares_it -- --ignored --nocapture

      - name: Verify packaged Worker mTLS
        if: matrix.target == 'macos-arm64'
        run: cargo test -p tokamak --features native --test packaged_worker

      - name: Setup pnpm
        if: matrix.app
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Install the Astro example
        if: matrix.app
        shell: bash
        run: |
          npm ci --prefix tokamak-cli/npm --omit=optional --ignore-scripts
          npm run build --prefix tokamak-cli/npm
          pnpm --dir plugins install --frozen-lockfile
          pnpm --dir examples/astro install --frozen-lockfile

      - name: Select the newest Xcode
        if: matrix.app && runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Build the Astro example with tok
        if: matrix.app
        run: cargo run -p tokamak-cli -- build ${{ matrix.app }} --project examples/astro --platform-pack target/tokamak-platform-packs/${{ matrix.target }}

      - name: Serve the Astro example
        if: matrix.target == 'macos-arm64'
        env:
          TOKAMAK_TEST_ASTRO_APP: ${{ github.workspace }}/examples/astro/build/macos/tokamak-example-astro.app/Contents/Resources/app
        run: cargo test -p tokamak --features native --test packaged_worker serves_the_astro_example_that_tok_packages -- --ignored

      - name: Archive platform pack
        run: tar -czf "tokamak-platform-pack-${{ matrix.target }}.tar.gz" -C "target/tokamak-platform-packs/${{ matrix.target }}" .

      - name: Upload platform pack artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tokamak-platform-pack-${{ matrix.target }}
          path: tokamak-platform-pack-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

