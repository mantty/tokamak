name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokamak-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pre-checks (lint, format, typecheck, test, reports)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Install jscpd
        run: npm install --global jscpd@5.4.2

      - name: Run checks
        run: node scripts/collect-report.mjs all

      - name: Validate reports
        if: ${{ !cancelled() }}
        run: node scripts/validate-reports.mjs tokamak

      # Pull requests compare their reports with those of main's latest push.
      - name: Upload reports
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: check-reports
          path: reports/tokamak-*.json
          if-no-files-found: error

      - name: Update the check results comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=check-reports&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name check-reports --dir "$RUNNER_TEMP/main-reports"
          fi
          node scripts/check-comment.mjs tokamak "$RUNNER_TEMP/main-reports" > "$RUNNER_TEMP/check-comment.md"
          comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- check-results -->")) | .id')
          comment=${comments%%$'\n'*}
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" \
              -F "body=@$RUNNER_TEMP/check-comment.md" --silent
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/check-comment.md"
          fi

  general:
    name: Test Linux and Android
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Test Bash installer
        run: bash tests/install.sh

      - name: Test the Android platform pack
        run: bash platforms/android/tests/pack.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          ndk="${ANDROID_HOME}/ndk/29.0.14206865"
          toolchain="$(find "${ndk}/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          min_sdk="$(cat platforms/android/build/min-sdk)"
          {
            echo "CC_aarch64_linux_android=${toolchain}/bin/aarch64-linux-android${min_sdk}-clang"
            echo "AR_aarch64_linux_android=${toolchain}/bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${toolchain}/bin/llvm-ranlib"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android${min_sdk} --sysroot=${toolchain}/sysroot"
          } >> "${GITHUB_ENV}"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Test native plugin requests
        run: |
          android_jar="$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)"
          kotlinc -classpath "$android_jar" plugins/core/android/src/main/kotlin/TokamakPlugin.kt plugins/core/android/src/main/kotlin/TokamakResources.kt plugins/core/android/src/main/kotlin/TokamakPluginRequests.kt platforms/android/tests/plugin-requests.kt -include-runtime -d "$RUNNER_TEMP/plugin-requests.jar"
          # android.jar's org.json is stubs; the JVM runs the reference implementation.
          curl -fsSL -o "$RUNNER_TEMP/json.jar" https://repo1.maven.org/maven2/org/json/json/20250517/json-20250517.jar
          java -cp "$RUNNER_TEMP/plugin-requests.jar:$RUNNER_TEMP/json.jar:$android_jar" com.tokamak.runtime.Plugin_requestsKt

      - name: Install plugin dependencies
        working-directory: plugins
        run: pnpm install --frozen-lockfile

      - name: Check plugins
        working-directory: plugins
        run: |
          pnpm lint:ts
          pnpm test:ts

      - name: Install CLI package dependencies
        run: npm ci --prefix tokamak-cli/npm

      - name: Check CLI package
        working-directory: tokamak-cli/npm
        run: |
          npm run build
          npm test

      - name: Install runtime test dependencies
        run: |
          pnpm --dir tokamak/tests/quickjs_runtime install --frozen-lockfile
          pnpm --dir examples/astro install --frozen-lockfile

      - name: Build Astro runtime fixture
        run: pnpm --dir examples/astro build

      - name: Test runtime JavaScript
        run: node --test tokamak/tests/quickjs_runtime/runtime.test.mjs

      # The pre-checks lint, format and test the host build.
      - name: Lint Android Rust
        run: cargo clippy -p tokamak --lib --target aarch64-linux-android --features native -- -D warnings

      - name: Test native Rust
        run: cargo test -p tokamak --features native

      - name: Test the Kotlin describer and generated plugin files
        run: bash platforms/android/tests/describe.sh

  apple:
    name: Test Apple
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-darwin,x86_64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Check Swift formatting
        run: xcrun swift-format lint --strict platforms/apple/source/*.swift platforms/apple/tests/*.swift platforms/apple/describer/Package.swift platforms/apple/describer/Sources/*/*.swift platforms/apple/describer/Tests/*/*.swift plugins/core/apple/TokamakPlugin/Package.swift plugins/core/apple/TokamakPlugin/Sources/*/*.swift plugins/*/apple/Package.swift plugins/*/apple/Sources/*/*.swift

      - name: Test native plugin requests
        run: bash platforms/apple/tests/plugin-requests.sh

      - name: Lint Apple Rust
        run: |
          cargo clippy -p tokamak-cli --all-targets -- -D warnings
          cargo clippy -p tokamak --lib --target aarch64-apple-ios --features native -- -D warnings
          cargo clippy -p tokamak --lib --target aarch64-apple-ios-sim --features native -- -D warnings
          cargo clippy -p tokamak --lib --target x86_64-apple-ios --features native -- -D warnings
          cargo clippy -p tokamak --lib --target x86_64-apple-darwin --features native -- -D warnings

      - name: Test the Apple platform pack
        run: cargo test -p tokamak-apple-signing

      - name: Test the CLI
        run: cargo test -p tokamak-cli

      - name: Test the gateway
        run: cargo test -p tokamak --features native --lib -- gateway::tests

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Build plugins
        run: bash platforms/apple/tests/plugins.sh

      - name: Test the Swift describer and generated plugin files
        run: |
          swift test --package-path platforms/apple/describer
          bash platforms/apple/tests/describe.sh

  windows:
    name: Test Windows
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Test PowerShell installer
        shell: powershell
        run: ./tests/install.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false

      - name: Lint Windows Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy -p tokamak-cli --all-targets -- -D warnings
          cargo clippy -p windows-shell --all-targets -- -D warnings

      - name: Test Windows Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test -p windows-shell
          cargo test -p tokamak-cli
          cargo test -p tokamak --features native --lib -- gateway::tests

  validate:
    name: Validate
    if: ${{ always() }}
    needs:
      - checks
      - general
      - apple
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check job results
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          GENERAL_RESULT: ${{ needs.general.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "${CHECKS_RESULT}" = success
          test "${GENERAL_RESULT}" = success
          test "${APPLE_RESULT}" = success
          test "${WINDOWS_RESULT}" = success
