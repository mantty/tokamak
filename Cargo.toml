[workspace]
resolver = "3"
exclude = ["rquickjs"]
members = [
    "tokamak",
    "tokamak-cli",
    "platforms/apple/signing",
    "platforms/windows",
    "tools/xtask",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[patch.crates-io]
rquickjs-sys = { path = "rquickjs" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
aes = "0.9"
aes-kw = "0.3"
cbc = "0.2"
ctr = "0.10"
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "rand_core"] }
crypto-primes = { version = "0.7", default-features = false }
der = "0.8"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "rand_core"] }
ghash = "0.6"
hkdf = "0.13"
md-5 = { version = "0.11", features = ["oid"] }
p12-keystore = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
pkcs8 = { version = "0.11", features = ["std"] }
rand_core = "0.10"
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std", "encoding", "hazmat", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-platform-verifier = "0.7"
scrypt = { version = "0.12", default-features = false }
sha1 = { version = "0.11", features = ["oid"] }
spki = { version = "0.8", features = ["std"] }
subtle = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "getrandom"] }
anyhow = "1.0.102"
assert_cmd = "2.2.2"
async-compression = { version = "0.4.46", features = ["tokio", "gzip"] }
base64 = "0.22.1"
brotlic-sys = "=0.2.2"
block2 = "0.6.2"
clap = { version = "4.6.1", features = ["derive"] }
dispatch2 = "0.3.1"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.8", default-features = false, features = ["zlib-rs"] }
flume = { version = "0.12.0", default-features = false, features = ["async", "select"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
getrandom = { version = "0.4.2", features = ["sys_rng"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
hyper = { version = "1.11.1", default-features = false }
fixed_decimal = "0.7.2"
icu = { version = "2.3.1", default-features = false, features = ["serde", "sync", "unstable"] }
icu_provider = "2.3.1"
icu_provider_blob = { version = "2.3.0", features = ["alloc"] }
icu_provider_adapters = "2.3.0"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }
lol_html = "3.0.1"
libz-rs-sys = "=0.6.8"
jsonc-parser = "0.32.4"
mime_guess = "2.0.5"
md4 = { version = "0.11.0", features = ["zeroize"] }
netdev = { version = "0.46.1", default-features = false, features = ["gateway"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-security = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-web-kit = "0.3.2"
plist = "1.10.0"
jni = "0.21.1"
libc = "0.2.186"
mio = { version = "1.2.2", default-features = false, features = ["os-poll", "net"] }
predicates = "3.1.3"
rcgen = "0.14.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.11.0", features = ["oid"] }
security-framework = "3.7.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = "0.3.47"
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }
toml = "1.1.2"
walkdir = "2.5.0"
writeable = "0.6.4"
wry = { version = "0.55.1", default-features = false }
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
zstd = { version = "0.13.3", default-features = false, features = ["arrays"] }
rquickjs = { version = "0.12.2", features = ["loader", "macro", "futures"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
url = "2.5.8"
urlpattern = "0.6.0"
