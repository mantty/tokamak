[env]
MACOSX_DEPLOYMENT_TARGET = "13.0"
# MSVC's /OPT:REF drops only COMDATs. /Gw makes each C global one, so an app
# link drops the C code, such as SQLite, that only an unlinked part uses.
CFLAGS_x86_64_pc_windows_msvc = "/Gw"
# SQLite compile options, read by libsqlite3-sys and by `cargo run -p xtask --
# sqlite`, which generates libsqlite3-sys/sqlite3 with them. Lines: D1's
# features; libsqlite3-sys defaults D1 lacks; what D1 refuses or tokamak never
# calls.
LIBSQLITE3_FLAGS = """
-DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_MATH_FUNCTIONS
-DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_DEFAULT_FOREIGN_KEYS=1
-DSQLITE_MAX_ALLOCATION_SIZE=16777216 -DSQLITE_PRINTF_PRECISION_LIMIT=100000
-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_STAT4
-USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_SOUNDEX
-USQLITE_ENABLE_LOAD_EXTENSION -USQLITE_ENABLE_MEMORY_MANAGEMENT
-USQLITE_ENABLE_API_ARMOR -USQLITE_USE_URI
-DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_DEPRECATED
-DSQLITE_OMIT_DECLTYPE -DSQLITE_OMIT_GET_TABLE -DSQLITE_OMIT_TCL_VARIABLE
-DSQLITE_OMIT_COMPLETE -DSQLITE_OMIT_INTROSPECTION_PRAGMAS
-DSQLITE_OMIT_COMPILEOPTION_DIAGS -DSQLITE_OMIT_AUTOVACUUM -DSQLITE_OMIT_UTF16
-DSQLITE_OMIT_TRACE -DSQLITE_OMIT_DESERIALIZE -DSQLITE_OMIT_BUILTIN_TEST
-DSQLITE_UNTESTABLE -DSQLITE_DEFAULT_MEMSTATUS=0
"""
